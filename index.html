<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OEE DASHBOARD • PT GOF</title>
    
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        
        body { background: #f8fafc; transition: background 0.3s ease; }
        
        /* Dark Mode */
        [data-theme="dark"] body { background: #0f172a; }
        [data-theme="dark"] .card { background: #1e293b; border-color: #334155; }
        [data-theme="dark"] .card-header { color: #f1f5f9; }
        [data-theme="dark"] .input-field { background: #334155; border-color: #475569; color: #f1f5f9; }
        [data-theme="dark"] .text-secondary { color: #94a3b8; }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            margin-bottom: 1.5rem;
        }
        
        .card-header {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #1e293b;
        }
        
        .input-field {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.9rem;
            transition: all 0.2s;
            background: white;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(102,126,234,0.3); }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        
        .btn-secondary:hover { background: #e2e8f0; }
        
        .scorecard {
            background: linear-gradient(135deg, #ffffff, #f8fafc);
            border-radius: 16px;
            padding: 1.5rem;
            border: 2px solid #e2e8f0;
            text-align: center;
        }
        
        .scorecard-value {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0.5rem 0;
            line-height: 1.2;
        }
        
        .scorecard-label {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .scorecard.good .scorecard-value { color: #10b981; }
        .scorecard.bad .scorecard-value { color: #ef4444; }
        
        .badge-success {
            background: rgba(16,185,129,0.1);
            color: #10b981;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .badge-danger {
            background: rgba(239,68,68,0.1);
            color: #ef4444;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .filter-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .chart-container {
            height: 300px;
            position: relative;
        }
        
        .chart-container-horizontal {
            height: 350px;
            position: relative;
        }
        
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }
        
        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        
        td {
            padding: 0.8rem;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.85rem;
        }
        
        tr.clickable-row {
            cursor: pointer;
            transition: background 0.2s;
        }
        
        tr.clickable-row:hover {
            background: rgba(102,126,234,0.05);
        }
        
        .status-good { color: #10b981; font-weight: 600; }
        .status-bad { color: #ef4444; font-weight: 600; }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            border-left: 4px solid #10b981;
            font-weight: 600;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 1rem;
        }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        .detail-item {
            background: #f8fafc;
            padding: 0.8rem;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .detail-item-label {
            font-size: 0.7rem;
            color: #64748b;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
        }
        
        .detail-item-value {
            font-weight: 600;
            color: #1e293b;
        }
        
        @media (max-width: 768px) {
            .card { padding: 1rem; }
            .scorecard-value { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div id="app"></div>

<script>
(function() {
    'use strict';
    
    // ==================== KONFIGURASI ====================
    const CONFIG = {
        OEE_TARGET: 88,
        OEE365_TARGET: 55,
        A_TARGET: 93,
        P_TARGET: 98,
        Q_TARGET: 99,
        A365_TARGET: 60
    };
    
    const SHIFTS = {
        'Shift 1': { start: '07:00', end: '15:30', minutes: 510 },
        'Shift 2': { start: '15:20', end: '22:50', minutes: 450 },
        'Shift 3': { start: '22:40', end: '07:10', minutes: 530 },
        'Longshift Pagi': { start: '07:00', end: '19:00', minutes: 720 },
        'Longshift Malam': { start: '19:00', end: '07:00', minutes: 720 }
    };
    
    // ==================== DATA DUMMY ====================
    // PASTI AMAN - Data dummy untuk testing
    const dummyMachines = [
        { id: '1', machine_name: 'INJEKSI 1', area: 'Injeksi', target_per_minute: 2, pic: 'BUDI' },
        { id: '2', machine_name: 'INJEKSI 2', area: 'Injeksi', target_per_minute: 2.5, pic: 'BUDI' },
        { id: '3', machine_name: 'BLOW 1', area: 'Injeksi', target_per_minute: 1.5, pic: 'AGUS' },
        { id: '4', machine_name: 'FILLING 1', area: 'Non Injeksi', target_per_minute: 5, pic: 'SITI' },
        { id: '5', machine_name: 'FILLING 2', area: 'Non Injeksi', target_per_minute: 4, pic: 'SITI' },
        { id: '6', machine_name: 'PACKING 1', area: 'Non Injeksi', target_per_minute: 10, pic: 'JOKO' }
    ];
    
    // Generate dummy records (30 hari terakhir)
    const dummyRecords = [];
    const today = new Date();
    const machineNames = dummyMachines.map(m => m.machine_name);
    const pics = ['BUDI', 'AGUS', 'SITI', 'JOKO', 'RUDI', 'DEWI'];
    const shifts = ['Shift 1', 'Shift 2', 'Shift 3', 'Longshift Pagi', 'Longshift Malam'];
    
    for (let i = 0; i < 100; i++) {
        const date = new Date(today);
        date.setDate(date.getDate() - Math.floor(Math.random() * 60));
        const dateStr = date.toISOString().split('T')[0];
        
        const machineIdx = Math.floor(Math.random() * machineNames.length);
        const machineName = machineNames[machineIdx];
        const machineId = dummyMachines.find(m => m.machine_name === machineName)?.id || '1';
        
        const avail = 85 + Math.random() * 15;
        const perf = 85 + Math.random() * 15;
        const qual = 95 + Math.random() * 5;
        const oeeActual = (avail * perf * qual) / 10000;
        const oee365 = oeeActual * 0.7;
        
        const output = Math.floor(Math.random() * 5000) + 1000;
        const reject = Math.floor(Math.random() * 100);
        
        dummyRecords.push({
            id: `rec_${i}`,
            date: dateStr,
            shift: shifts[Math.floor(Math.random() * shifts.length)],
            shift_minutes: 480,
            machine_name: machineName,
            machine_id: machineId,
            pic: pics[Math.floor(Math.random() * pics.length)],
            product_code: `PRD${Math.floor(Math.random() * 100)}`,
            batch_number: `BATCH${Math.floor(Math.random() * 1000)}`,
            actual_output: output,
            reject: reject,
            availability_actual: avail,
            availability_365: avail * 0.9,
            performance: perf,
            quality: qual,
            oee_actual: oeeActual,
            oee_365: oee365,
            minor_stop_count: Math.floor(Math.random() * 10),
            odt_data: JSON.stringify([]),
            line_stop_mesin_data: JSON.stringify([]),
            line_stop_non_mesin_data: JSON.stringify([]),
            minor_stop_data: JSON.stringify([]),
            notes: `Notes ${i}`
        });
    }
    
    // Sort by date descending
    dummyRecords.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    // ==================== STATE ====================
    const state = {
        machines: dummyMachines,
        records: dummyRecords,
        currentPage: 'dashboard',
        filters: {
            startDate: getDefaultStartDate(),
            endDate: new Date().toISOString().split('T')[0],
            shift: 'all',
            machine: 'all',
            pic: 'all',
            detailLineStopItem: 'all',
            detailLineStopType: 'all'
        },
        clickedRecordFilter: null,
        chartInstances: {},
        theme: localStorage.getItem('oee-theme') || 'light'
    };
    
    // ==================== HELPER FUNCTIONS ====================
    function getDefaultStartDate() {
        const date = new Date();
        date.setDate(1);
        return date.toISOString().split('T')[0];
    }
    
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = type === 'success' ? '#10b981' : '#ef4444';
        toast.innerHTML = `<span style="margin-right: 8px;">${type === 'success' ? '✅' : '❌'}</span>${message}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function showLoading(message = 'Loading...') {
        const overlay = document.createElement('div');
        overlay.id = 'loading-overlay';
        overlay.className = 'loading-overlay';
        overlay.innerHTML = `
            <div style="background: white; padding: 2rem; border-radius: 16px; text-align: center;">
                <div class="spinner" style="border-top-color: #667eea; margin: 0 auto 1rem;"></div>
                <p style="color: #1e293b; font-weight: 600;">${message}</p>
            </div>
        `;
        document.body.appendChild(overlay);
    }
    
    function hideLoading() {
        document.getElementById('loading-overlay')?.remove();
    }
    
    function showModal(content) {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-content">${content}</div>`;
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        document.body.appendChild(modal);
    }
    
    function closeModal() {
        document.querySelector('.modal-overlay')?.remove();
    }
    
    function safeJSONParse(str, defaultValue = []) {
        if (!str) return defaultValue;
        try {
            return typeof str === 'string' ? JSON.parse(str) : (str || defaultValue);
        } catch {
            return defaultValue;
        }
    }
    
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        try {
            return new Date(dateStr).toLocaleDateString('id-ID');
        } catch {
            return dateStr;
        }
    }
    
    // ==================== FILTER FUNCTIONS ====================
    function getFilteredRecords() {
        try {
            let records = state.records.filter(r => {
                if (!r.date) return false;
                
                const rDate = new Date(r.date);
                const sDate = new Date(state.filters.startDate);
                const eDate = new Date(state.filters.endDate);
                eDate.setHours(23, 59, 59);
                
                const dateMatch = rDate >= sDate && rDate <= eDate;
                if (!dateMatch) return false;
                
                if (state.filters.shift !== 'all' && r.shift !== state.filters.shift) return false;
                if (state.filters.machine !== 'all' && r.machine_name !== state.filters.machine) return false;
                if (state.filters.pic !== 'all' && r.pic !== state.filters.pic) return false;
                
                return true;
            });
            
            // Filter detail jika aktif
            if (state.filters.detailLineStopItem !== 'all') {
                records = records.filter(r => {
                    if (state.filters.detailLineStopType === 'mesin') {
                        const data = safeJSONParse(r.line_stop_mesin_data);
                        return data.some(d => d.item === state.filters.detailLineStopItem);
                    } else if (state.filters.detailLineStopType === 'non_mesin') {
                        const data = safeJSONParse(r.line_stop_non_mesin_data);
                        return data.some(d => d.item === state.filters.detailLineStopItem);
                    }
                    return false;
                });
            }
            
            return records;
        } catch (error) {
            console.error('Error filtering records:', error);
            return [];
        }
    }
    
    function updateFilter(key, value) {
        try {
            state.filters[key] = value;
            state.clickedRecordFilter = null;
            renderApp();
        } catch (error) {
            console.error('Error updating filter:', error);
            showToast('Gagal mengupdate filter', 'error');
        }
    }
    
    function setDetailFilter(item, type) {
        try {
            state.filters.detailLineStopItem = item;
            state.filters.detailLineStopType = type;
            state.clickedRecordFilter = null;
            renderApp();
            showToast(`Filter: ${item}`, 'success');
        } catch (error) {
            console.error('Error setting detail filter:', error);
        }
    }
    
    function clearDetailFilter() {
        try {
            state.filters.detailLineStopItem = 'all';
            state.filters.detailLineStopType = 'all';
            renderApp();
            showToast('Filter dihapus', 'success');
        } catch (error) {
            console.error('Error clearing detail filter:', error);
        }
    }
    
    function filterByClickedRecord(record) {
        try {
            state.clickedRecordFilter = {
                date: record.date,
                shift: record.shift,
                machine: record.machine_name,
                pic: record.pic
            };
            state.filters.startDate = record.date;
            state.filters.endDate = record.date;
            state.filters.shift = record.shift;
            state.filters.machine = record.machine_name;
            state.filters.pic = record.pic;
            state.filters.detailLineStopItem = 'all';
            renderApp();
            showToast(`Menampilkan data untuk record ini`, 'success');
        } catch (error) {
            console.error('Error filtering by clicked record:', error);
        }
    }
    
    function resetClickedFilter() {
        try {
            state.clickedRecordFilter = null;
            state.filters.startDate = getDefaultStartDate();
            state.filters.endDate = new Date().toISOString().split('T')[0];
            state.filters.shift = 'all';
            state.filters.machine = 'all';
            state.filters.pic = 'all';
            renderApp();
            showToast('Filter direset', 'success');
        } catch (error) {
            console.error('Error resetting filter:', error);
        }
    }
    
    // ==================== DASHBOARD CALCULATIONS ====================
    function calculateMetrics(records) {
        try {
            if (!records.length) {
                return {
                    avgA: 0, avgP: 0, avgQ: 0, avgOEEActual: 0,
                    avgOEE365: 0, totalOutput: 0, totalRecords: 0
                };
            }
            
            const avgA = records.reduce((sum, r) => sum + (r.availability_actual || 0), 0) / records.length;
            const avgP = records.reduce((sum, r) => sum + (r.performance || 0), 0) / records.length;
            const avgQ = records.reduce((sum, r) => sum + (r.quality || 0), 0) / records.length;
            const avgOEEActual = (avgA * avgP * avgQ) / 10000;
            const avgOEE365 = records.reduce((sum, r) => sum + (r.oee_365 || 0), 0) / records.length;
            const totalOutput = records.reduce((sum, r) => sum + (r.actual_output || 0), 0);
            
            return { avgA, avgP, avgQ, avgOEEActual, avgOEE365, totalOutput, totalRecords: records.length };
        } catch (error) {
            console.error('Error calculating metrics:', error);
            return { avgA: 0, avgP: 0, avgQ: 0, avgOEEActual: 0, avgOEE365: 0, totalOutput: 0, totalRecords: 0 };
        }
    }
    
    function calculateOperatorPerformance(records) {
        try {
            const picStats = {};
            
            records.forEach(r => {
                if (!r.pic) return;
                
                if (!picStats[r.pic]) {
                    picStats[r.pic] = {
                        totalOEE: 0,
                        totalOutput: 0,
                        totalTargetOutput: 0,
                        count: 0
                    };
                }
                
                picStats[r.pic].totalOEE += r.oee_actual || 0;
                picStats[r.pic].totalOutput += r.actual_output || 0;
                picStats[r.pic].totalTargetOutput += (r.actual_output || 0) * (1 + Math.random() * 0.2); // dummy target
                picStats[r.pic].count += 1;
            });
            
            return Object.entries(picStats)
                .map(([pic, stats]) => ({
                    pic,
                    avgOEE: stats.totalOEE / stats.count,
                    totalOutput: stats.totalOutput,
                    totalTargetOutput: stats.totalTargetOutput,
                    count: stats.count
                }))
                .sort((a, b) => b.avgOEE - a.avgOEE);
        } catch (error) {
            console.error('Error calculating operator performance:', error);
            return [];
        }
    }
    
    // ==================== CHART RENDERING ====================
    function destroyAllCharts() {
        try {
            Object.values(state.chartInstances).forEach(chart => {
                if (chart && chart.destroy) chart.destroy();
            });
            state.chartInstances = {};
        } catch (error) {
            console.error('Error destroying charts:', error);
        }
    }
    
    function renderTrendChart(records) {
        try {
            const ctx = document.getElementById('chart-trend');
            if (!ctx) return;
            
            const currentYear = new Date().getFullYear();
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            
            // Data per bulan
            const monthlyData = Array(12).fill().map(() => []);
            
            records.forEach(r => {
                if (!r.date || !r.oee_actual) return;
                const date = new Date(r.date);
                if (date.getFullYear() !== currentYear) return;
                const month = date.getMonth();
                monthlyData[month].push(r.oee_actual);
            });
            
            const monthlyAvg = monthlyData.map(arr => 
                arr.length ? arr.reduce((sum, v) => sum + v, 0) / arr.length : null
            );
            
            const hasData = monthlyAvg.some(v => v !== null);
            if (!hasData) return;
            
            const colors = monthlyAvg.map(v => 
                v !== null && v >= CONFIG.OEE_TARGET ? '#10b981' : '#ef4444'
            );
            
            state.chartInstances.trend = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: monthNames,
                    datasets: [{
                        label: `OEE ${currentYear}`,
                        data: monthlyAvg,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102,126,234,0.1)',
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: colors,
                        pointBorderColor: colors,
                        pointRadius: 6,
                        spanGaps: true
                    }, {
                        label: `Target ${CONFIG.OEE_TARGET}%`,
                        data: Array(12).fill(CONFIG.OEE_TARGET),
                        borderColor: '#10b981',
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    if (ctx.raw === null) return 'Tidak ada data';
                                    return `${ctx.dataset.label}: ${ctx.raw.toFixed(1)}%`;
                                }
                            }
                        }
                    },
                    scales: { y: { beginAtZero: true, max: 100 } }
                }
            });
        } catch (error) {
            console.error('Error rendering trend chart:', error);
        }
    }
    
    function renderPerMachineChart(records) {
        try {
            const ctx = document.getElementById('chart-per-machine');
            if (!ctx) return;
            
            const machineStats = {};
            records.forEach(r => {
                if (!r.machine_name || !r.oee_actual) return;
                if (!machineStats[r.machine_name]) {
                    machineStats[r.machine_name] = { total: 0, count: 0 };
                }
                machineStats[r.machine_name].total += r.oee_actual;
                machineStats[r.machine_name].count += 1;
            });
            
            const data = Object.entries(machineStats)
                .map(([name, stats]) => ({ name, avg: stats.total / stats.count }))
                .sort((a, b) => b.avg - a.avg);
            
            if (!data.length) return;
            
            const colors = data.map(d => d.avg >= CONFIG.OEE_TARGET ? '#10b981' : '#ef4444');
            
            state.chartInstances.perMachine = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.name),
                    datasets: [{
                        label: 'OEE Actual',
                        data: data.map(d => d.avg),
                        backgroundColor: colors
                    }, {
                        label: `Target ${CONFIG.OEE_TARGET}%`,
                        data: Array(data.length).fill(CONFIG.OEE_TARGET),
                        type: 'line',
                        borderColor: '#10b981',
                        borderDash: [5, 5],
                        pointRadius: 0,

    function renderAPQChart(records) {
        try {
            const ctx = document.getElementById('chart-apq');
            if (!ctx) return;
            
            const avgA = records.length ? records.reduce((s, r) => s + (r.availability_actual || 0), 0) / records.length : 0;
            const avgP = records.length ? records.reduce((s, r) => s + (r.performance || 0), 0) / records.length : 0;
            const avgQ = records.length ? records.reduce((s, r) => s + (r.quality || 0), 0) / records.length : 0;
            const avgA365 = records.length ? records.reduce((s, r) => s + (r.availability_365 || 0), 0) / records.length : 0;
            
            const colors = [
                avgA >= CONFIG.A_TARGET ? '#10b981' : '#ef4444',
                avgP >= CONFIG.P_TARGET ? '#10b981' : '#ef4444',
                avgQ >= CONFIG.Q_TARGET ? '#10b981' : '#ef4444',
                avgA365 >= CONFIG.A365_TARGET ? '#10b981' : '#ef4444'
            ];
            
            state.chartInstances.apq = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Availability', 'Performance', 'Quality', 'Availability 365'],
                    datasets: [{
                        data: [avgA, avgP, avgQ, avgA365],
                        backgroundColor: colors
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {

                        tooltip: {

                    <div class="p-3 bg-purple-50 rounded-lg text-center">
                        <div class="text-xs text-purple-600">PERF</div>
                        <div class="font-bold text-lg">${(record.performance || 0).toFixed(1)}%</div>
                    </div>
                    <div class="p-3 bg-green-50 rounded-lg text-center">
                        <div class="text-xs text-green-600">QUAL</div>
                        <div class="font-bold text-lg">${(record.quality || 0).toFixed(1)}%</div>
                    </div>
                </div>
                
                <div class="bg-gradient-to-r from-blue-50 to-purple-50 p-4 rounded-xl text-center mb-6">
                    <div class="text-sm text-gray-600">OEE ACTUAL</div>
                    <div class="text-3xl font-bold ${(record.oee_actual || 0) >= 88 ? 'text-green-600' : 'text-red-600'}">
                        ${(record.oee_actual || 0).toFixed(1)}%
                    </div>
                </div>
                
                <div class="flex justify-end">
                    <button class="btn btn-secondary" onclick="closeModal()">Tutup</button>
                    <button class="btn btn-primary ml-2" onclick="filterByClickedRecord(${JSON.stringify(record).replace(/'/g, "\\'")}); closeModal()">
                        Filter Data Ini
                    </button>
                </div>
            `);
        } catch (error) {
            console.error('Error showing record detail:', error);
            showToast('Gagal menampilkan detail', 'error');
        }
    }
    
    // ==================== NAVIGATION ====================
    window.navigateTo = function(page) {
        try {
            state.currentPage = page;
            renderApp();
        } catch (error) {
            console.error('Error navigating:', error);
        }
    };
    
    // ==================== EXPOSE FUNCTIONS TO WINDOW ====================
    window.updateFilter = updateFilter;
    window.setDetailFilter = setDetailFilter;
    window.clearDetailFilter = clearDetailFilter;
    window.filterByClickedRecord = filterByClickedRecord;
    window.resetClickedFilter = resetClickedFilter;
    window.showRecordDetail = showRecordDetail;
    window.renderCharts = renderCharts;
    window.closeModal = closeModal;
    
    // ==================== INIT ====================
    function init() {
        try {
            console.log('Initializing OEE Dashboard...');
            
            // Set theme
            document.documentElement.setAttribute('data-theme', state.theme);
            
            // Render app
            renderApp();
            
            console.log('Initialization complete');
        } catch (error) {
            console.error('Initialization error:', error);
            document.getElementById('app').innerHTML = `
                <div class="p-8 text-center text-red-600">
                    <h2 class="text-2xl mb-4">Error Initializing App</h2>
                    <p>${error.message}</p>
                    <button class="btn btn-primary mt-4" onclick="location.reload()">Reload</button>
                </div>
            `;
        }
    }
    
    // Start the app
    init();
})();
</script>

</body>
</html>
