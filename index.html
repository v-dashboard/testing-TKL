<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OEE TKL SYSTEM • PT GOF</title>
    
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        
        body { background: #f8fafc; transition: background 0.3s ease; }
        
        [data-theme="dark"] body { background: #0f172a; }
        [data-theme="dark"] .card { background: #1e293b; border-color: #334155; }
        [data-theme="dark"] .card-header { color: #f1f5f9; }
        [data-theme="dark"] .input-field { background: #334155; border-color: #475569; color: #f1f5f9; }
        
        .card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            margin-bottom: 1.5rem;
        }
        
        .card-header {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #1e293b;
        }
        
        .input-field {
            width: 100%;
            padding: 0.6rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.9rem;
            transition: all 0.2s;
            background: white;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(102,126,234,0.3); }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
        }
        
        .btn-secondary:hover { background: #e2e8f0; }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem;
            background: white;
            border-radius: 100px;
            border: 1px solid #e2e8f0;
            margin-bottom: 2rem;
        }
        
        .nav-tab {
            padding: 0.6rem 1.5rem;
            border-radius: 100px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .nav-tab:hover { background: #f1f5f9; }
        .nav-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .kode-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            padding: 4px 8px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
        }
        .kode-1 { background: #fef3c7; color: #92400e; }
        .kode-2 { background: #d1fae5; color: #065f46; }
        .kode-3 { background: #fee2e2; color: #991b1b; }
        .kode-5 { background: #f3e8ff; color: #6b21a8; }
        .kode-6 { background: #ffe4e6; color: #9f1239; }
        .kode-7 { background: #cffafe; color: #155e75; }
        .kode-8 { background: #fed7aa; color: #7b341e; }
        .kode-9 { background: #f1f5f9; color: #334155; }
        
        .tally-mark {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }
        
        .scorecard {
            background: linear-gradient(135deg, #ffffff, #f8fafc);
            border-radius: 16px;
            padding: 1.5rem;
            border: 2px solid #e2e8f0;
            text-align: center;
        }
        
        .scorecard-value {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0.5rem 0;
            line-height: 1.2;
        }
        
        .scorecard-label {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .scorecard.good .scorecard-value { color: #10b981; }
        .scorecard.bad .scorecard-value { color: #ef4444; }
        
        .resume-card {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid #e2e8f0;
        }
        
        .resume-value {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .sisa-jam-card {
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid #7dd3fc;
        }
        
        .timeline-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
        }
        
        .checkbox-item.active {
            background: rgba(102,125,234,0.1);
            border-color: #667eea;
        }
        
        .checkbox-item.exceed {
            background: rgba(245,158,11,0.1);
            border-color: #f59e0b;
        }
        
        .odt-exceed-warning {
            background: rgba(245,158,11,0.1);
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 12px;
            color: #f59e0b;
        }
        
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }
        
        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        
        td {
            padding: 0.8rem;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.85rem;
        }
        
        tr.clickable-row {
            cursor: pointer;
            transition: background 0.2s;
        }
        
        tr.clickable-row:hover {
            background: rgba(102,126,234,0.05);
        }
        
        .status-good { color: #10b981; font-weight: 600; }
        .status-bad { color: #ef4444; font-weight: 600; }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            border-left: 4px solid #10b981;
            font-weight: 600;
            z-index: 9999;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }
        
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 1rem;
        }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        .filter-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .chart-container {
            height: 300px;
            position: relative;
        }
        
        .chart-container-horizontal {
            height: 350px;
            position: relative;
        }
        
        .gradient-bg {
            background: linear-gradient(-45deg, #667eea, #764ba2, #6b46c1, #4299e1);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @media (max-width: 768px) {
            .card { padding: 1rem; }
            .nav-tabs { border-radius: 20px; flex-wrap: wrap; }
            .nav-tab { flex: 1 1 auto; text-align: center; }
        }
    </style>
</head>
<body>

<div id="app"></div>

<script>
(function() {
    'use strict';
    
    // ==================== KONFIGURASI ====================
    const CONFIG = {
        OEE_TARGET: 88,
        OEE365_TARGET: 55,
        A_TARGET: 93,
        P_TARGET: 98,
        Q_TARGET: 99,
        A365_TARGET: 60,
        MANAGEMENT_PASSWORD: 'admin123'
    };
    
    const KODE_TKL = {
        '1': { name: 'PERSIAPAN AWAL (SETUP)', icon: '🔧', hasDuration: true },
        '2': { name: 'JALAN PROSES (MACHINE RUNNING)', icon: '⚙️', hasDuration: false },
        '3': { name: 'LINESTOP MESIN', icon: '⚠️', hasDuration: false },
        '5': { name: 'AM ACTIVITY (5R, CLIT, CLOSE WHITE TAG)', icon: '🧹', hasDuration: true },
        '6': { name: 'PM, CLOSE YELLOW & RED TAG', icon: '🔩', hasDuration: false },
        '7': { name: 'CLEANING AKHIR (CLEANUP)', icon: '🧼', hasDuration: true },
        '8': { name: 'ISTIRAHAT, BRIEFING, CM, QCC, START UP', icon: '☕', hasDuration: true },
        '9': { name: 'LINE STOP NON MESIN', icon: '⏸️', hasDuration: false }
    };
    
    const SHIFTS = {
        'SHIFT 1 (07:00-15:30)': { start: '07:00', end: '15:30', minutes: 510 },
        'SHIFT 2 (15:20-22:50)': { start: '15:20', end: '22:50', minutes: 450 },
        'SHIFT 3 (22:40-07:10)': { start: '22:40', end: '07:10', minutes: 530 }
    };
    
    // ==================== STATE ====================
    const state = {
        currentPage: 'dashboard',
        machines: [],
        tklRecords: [],
        libraryKegiatan: {},
        
        // Input TKL state
        kegiatanList: [],
        batches: [],
        minorStopCounts: {},
        selectedDate: new Date().toISOString().split('T')[0],
        selectedShift: '',
        selectedMachineId: '',
        selectedOperator: '',
        
        // Management
        isManagementUnlocked: false,
        editMode: false,
        editingRecordId: null,
        
        // Dashboard filters
        filters: {
            startDate: getDefaultStartDate(),
            endDate: new Date().toISOString().split('T')[0],
            shift: 'all',
            machine: 'all',
            pic: 'all',
            detailLineStopItem: 'all',
            detailLineStopType: 'all'
        },
        clickedRecordFilter: null,
        chartInstances: {},
        
        // Theme
        theme: localStorage.getItem('oee-theme') || 'light'
    };
    
    // ==================== DUMMY DATA ====================
    const dummyMachines = [
        { 
            id: '1', 
            name: 'INJEKSI 1', 
            target: 2,
            minorStop: ['ETIKET PUTUS', 'CODING KERING'],
            activities: { 
                "1": [{ nama: 'SETUP INJEKSI', durasi: 30 }],
                "2": [{ nama: 'RUNNING INJEKSI' }],
                "3": [{ nama: 'LINE STOP MESIN' }],
                "5": [{ nama: 'AM INJEKSI', durasi: 15 }],
                "6": [{ nama: 'PM INJEKSI' }],
                "7": [{ nama: 'CLEANUP INJEKSI', durasi: 25 }],
                "8": [{ nama: 'ISTIRAHAT', durasi: 60 }],
                "9": [{ nama: 'STOP NON MESIN' }]
            }
        },
        { 
            id: '2', 
            name: 'FILLING 1', 
            target: 5,
            minorStop: ['MATERIAL HABIS', 'SETTING'],
            activities: { 
                "1": [{ nama: 'SETUP FILLING', durasi: 20 }],
                "2": [{ nama: 'RUNNING FILLING' }],
                "3": [{ nama: 'LINE STOP FILLING' }],
                "5": [{ nama: 'AM FILLING', durasi: 10 }],
                "6": [{ nama: 'PM FILLING' }],
                "7": [{ nama: 'CLEANUP FILLING', durasi: 30 }],
                "8": [{ nama: 'ISTIRAHAT', durasi: 60 }],
                "9": [{ nama: 'STOP NON MESIN' }]
            }
        }
    ];
    
    const dummyLibrary = {
        '1': ['SETUP INJEKSI', 'SETUP BLOW', 'SETUP FILLING'],
        '2': ['RUNNING NORMAL', 'RUNNING CEPAT'],
        '3': ['LINE STOP MATERIAL', 'LINE STOP SETTING'],
        '5': ['AM SHIFT 1', 'AM SHIFT 2'],
        '6': ['PM MINGGUAN', 'PM BULANAN'],
        '7': ['CLEANUP SHIFT', 'CLEANUP TOTAL'],
        '8': ['ISTIRAHAT', 'BRIEFING'],
        '9': ['STOP LISTRIK', 'STOP AIR']
    };
    
    // Generate dummy records
    const dummyRecords = [];
    const today = new Date();
    const pics = ['BUDI', 'SITI', 'AGUS', 'JOKO'];
    
    for (let i = 0; i < 50; i++) {
        const date = new Date(today);
        date.setDate(date.getDate() - Math.floor(Math.random() * 30));
        
        const machine = dummyMachines[Math.floor(Math.random() * dummyMachines.length)];
        const avail = 85 + Math.random() * 15;
        const perf = 85 + Math.random() * 15;
        const qual = 95 + Math.random() * 5;
        const oeeActual = (avail * perf * qual) / 10000;
        
        dummyRecords.push({
            id: `rec_${i}`,
            date: date.toISOString().split('T')[0],
            shift: Object.keys(SHIFTS)[Math.floor(Math.random() * 3)],
            mesin_id: machine.id,
            mesin_name: machine.name,
            operator: pics[Math.floor(Math.random() * pics.length)],
            kegiatan: [],
            batches: [{ batch: `BATCH${i}`, good: Math.floor(Math.random() * 5000), reject: Math.floor(Math.random() * 100) }],
            total_good: Math.floor(Math.random() * 5000),
            total_defect: Math.floor(Math.random() * 100),
            availability: avail,
            availability_365: avail * 0.9,
            performance: perf,
            quality: qual,
            oee_actual: oeeActual,
            oee_365: oeeActual * 0.7,
            created_at: new Date().toISOString()
        });
    }
    
    // Initialize state with dummy data
    state.machines = dummyMachines;
    state.tklRecords = dummyRecords;
    state.libraryKegiatan = dummyLibrary;
    
    // ==================== HELPER FUNCTIONS ====================
    function getDefaultStartDate() {
        const date = new Date();
        date.setDate(1);
        return date.toISOString().split('T')[0];
    }
    
    function toUpper(str) {
        return str ? str.toString().toUpperCase() : '';
    }
    
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = type === 'success' ? '#10b981' : '#ef4444';
        toast.innerHTML = `<span style="margin-right: 8px;">${type === 'success' ? '✅' : '❌'}</span>${toUpper(message)}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function showLoading(message = 'Loading...') {
        const overlay = document.createElement('div');
        overlay.id = 'loading-overlay';
        overlay.className = 'loading-overlay';
        overlay.innerHTML = `
            <div style="background: white; padding: 2rem; border-radius: 16px; text-align: center;">
                <div class="spinner" style="border-top-color: #667eea; margin: 0 auto 1rem;"></div>
                <p style="color: #1e293b; font-weight: 600;">${message}</p>
            </div>
        `;
        document.body.appendChild(overlay);
    }
    
    function hideLoading() {
        document.getElementById('loading-overlay')?.remove();
    }
    
    function showModal(content) {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-content">${content}</div>`;
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        document.body.appendChild(modal);
    }
    
    function closeModal() {
        document.querySelector('.modal-overlay')?.remove();
    }
    
    function safeJSONParse(str, defaultValue = []) {
        if (!str) return defaultValue;
        try {
            return typeof str === 'string' ? JSON.parse(str) : (str || defaultValue);
        } catch {
            return defaultValue;
        }
    }
    
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        try {
            return new Date(dateStr).toLocaleDateString('id-ID');
        } catch {
            return dateStr;
        }
    }
    
    function getShiftMinutes(shiftKey) {
        return SHIFTS[shiftKey]?.minutes || 480;
    }
    
    function getShiftStart() {
        return state.selectedShift ? SHIFTS[state.selectedShift]?.start || '07:00' : '07:00';
    }
    
    function getShiftEnd() {
        return state.selectedShift ? SHIFTS[state.selectedShift]?.end || '15:30' : '15:30';
    }
    
    function getNextStart() {
        if (state.kegiatanList.length === 0) return getShiftStart();
        return state.kegiatanList[state.kegiatanList.length - 1].jam;
    }
    
    function addHour(time) {
        if (!time) return '08:00';
        const [h, m] = time.split(':').map(Number);
        const nh = (h + 1) % 24;
        return `${nh.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
    }
    
    function isTimeGreater(t1, t2) {
        if (!t1 || !t2) return false;
        const [h1, m1] = t1.split(':').map(Number);
        const [h2, m2] = t2.split(':').map(Number);
        return h1 > h2 || (h1 === h2 && m1 > m2);
    }
    
    function hitungDurasi(dari, sampai) {
        if (!dari || !sampai) return 0;
        const [h1,m1] = dari.split(':').map(Number);
        const [h2,m2] = sampai.split(':').map(Number);
        return (h2*60+m2) - (h1*60+m1);
    }
    
    // ==================== OEE CALCULATIONS ====================
    function hitungResume() {
        let totalStandar13578 = 0;
        let totalKode2 = 0;
        let totalKode6 = 0;
        let totalKode3 = 0;
        let totalKode9 = 0;
        let totalLebihan = 0;
        
        const mesin = state.machines.find(m => m.id === state.selectedMachineId);
        
        state.kegiatanList.forEach(k => {
            const dur = hitungDurasi(k.dari, k.jam);
            
            if (k.kode === 2) {
                totalKode2 += dur;
            } else if (k.kode === 6) {
                totalKode6 += dur;
            } else if (k.kode === 3) {
                totalKode3 += dur;
            } else if (k.kode === 9) {
                totalKode9 += dur;
            } else if ([1,5,7,8].includes(k.kode)) {
                let standar = 0;
                if (mesin?.activities && mesin.activities[k.kode]) {
                    const kegiatan = mesin.activities[k.kode].find(a => a.nama === k.kegiatan);
                    standar = kegiatan?.durasi || 0;
                }
                totalStandar13578 += standar;
                
                if (dur > standar) {
                    totalLebihan += (dur - standar);
                }
            }
        });
        
        const totalODT = totalStandar13578 + totalKode2 + totalKode6;
        const totalRunning = totalKode2;
        const totalLineStopMesin = totalKode3;
        const totalLineStopNonMesin = totalKode9 + totalLebihan;
        
        return { totalODT, totalRunning, totalLineStopMesin, totalLineStopNonMesin };
    }
    
    function hitungPerfAndQual() {
        const totalGood = state.batches.reduce((s, b) => s + (b.good || 0), 0);
        const totalReject = state.batches.reduce((s, b) => s + (b.reject || 0), 0);
        
        let running = 0;
        state.kegiatanList.forEach(k => {
            if (k.kode === 2) running += hitungDurasi(k.dari, k.jam);
        });
        
        const mesin = state.machines.find(m => m.id === state.selectedMachineId);
        const target = mesin?.target || 1;
        
        const perf = (running * target) ? (totalGood / (running * target)) * 100 : 0;
        const quality = totalGood ? ((totalGood - totalReject) / totalGood) * 100 : 100;
        
        return { perf, quality };
    }
    
    function hitungAvailAndOEE() {
        const resume = hitungResume();
        const perfQual = hitungPerfAndQual();
        const jamKerja = getShiftMinutes(state.selectedShift);
        
        // Pembilang = jam kerja - totalODT - LSM - LSNM - running
        const pembilang = jamKerja - resume.totalODT - resume.totalLineStopMesin - resume.totalLineStopNonMesin - resume.totalRunning;
        
        // AVAIL = pembilang / (jam kerja - totalODT - running)
        const penyebutAvail = jamKerja - resume.totalODT - resume.totalRunning;
        const avail = penyebutAvail > 0 ? (pembilang / penyebutAvail) * 100 : 0;
        
        // AVAIL 365 = pembilang / (jam kerja - running)
        const penyebutAvail365 = jamKerja - resume.totalRunning;
        const avail365 = penyebutAvail365 > 0 ? (pembilang / penyebutAvail365) * 100 : 0;
        
        const oeeValue = (avail * perfQual.perf * perfQual.quality) / 10000;
        const oee365 = (avail365 * perfQual.perf * perfQual.quality) / 10000;
        const sisaJamKerja = jamKerja - resume.totalODT - resume.totalLineStopMesin - resume.totalLineStopNonMesin - resume.totalRunning;
        
        return { 
            avail, 
            avail365, 
            perf: perfQual.perf, 
            quality: perfQual.quality, 
            oee: oeeValue,

    function getFilteredRecords() {
        try {
            return state.tklRecords.filter(r => {
                if (!r.date) return false;
                
                const rDate = new Date(r.date);
                const sDate = new Date(state.filters.startDate);
                const eDate = new Date(state.filters.endDate);
                eDate.setHours(23, 59, 59);
                
                const dateMatch = rDate >= sDate && rDate <= eDate;
                if (!dateMatch) return false;
                
                if (state.filters.shift !== 'all' && r.shift !== state.filters.shift) return false;
                if (state.filters.machine !== 'all' && r.mesin_name !== state.filters.machine) return false;
                if (state.filters.pic !== 'all' && r.operator !== state.filters.pic) return false;
                
                return true;
            });
        } catch (error) {
            console.error('Error filtering records:', error);
            return [];
        }
    }
    
    function calculateMetrics(records) {
        if (!records.length) {
            return { avgA: 0, avgP: 0, avgQ: 0, avgOEEActual: 0, avgOEE365: 0, totalOutput: 0, totalRecords: 0 };
        }
        
        const avgA = records.reduce((s, r) => s + (r.availability || 0), 0) / records.length;
        const avgP = records.reduce((s, r) => s + (r.performance || 0), 0) / records.length;
        const avgQ = records.reduce((s, r) => s + (r.quality || 0), 0) / records.length;
        const avgOEEActual = (avgA * avgP * avgQ) / 10000;
        const avgOEE365 = records.reduce((s, r) => s + (r.oee_365 || 0), 0) / records.length;
        const totalOutput = records.reduce((s, r) => s + (r.total_good || 0), 0);
        
        return { avgA, avgP, avgQ, avgOEEActual, avgOEE365, totalOutput, totalRecords: records.length };
    }
    
    function calculateOperatorPerformance(records) {
        const picStats = {};
        
        records.forEach(r => {
            if (!r.operator) return;
            
            if (!picStats[r.operator]) {
                picStats[r.operator] = { totalOEE: 0, totalOutput: 0, totalTargetOutput: 0, count: 0 };
            }
            
            picStats[r.operator].totalOEE += r.oee_actual || 0;
            picStats[r.operator].totalOutput += r.total_good || 0;
            picStats[r.operator].totalTargetOutput += (r.total_good || 0) * 1.2;
            picStats[r.operator].count += 1;
        });
        
        return Object.entries(picStats).map(([pic, stats]) => ({
            pic,
            avgOEE: stats.totalOEE / stats.count,
            totalOutput: stats.totalOutput,
            totalTargetOutput: stats.totalTargetOutput,
            count: stats.count
        })).sort((a, b) => b.avgOEE - a.avgOEE);
    }

    window.showTambahKegiatanModal = function() {
        if (!state.selectedMachineId) {
            showToast('PILIH MESIN TERLEBIH DAHULU', 'error');
            return;
        }
        
        const mesin = state.machines.find(m => m.id === state.selectedMachineId);
        if (!mesin) return;
        
        const start = getNextStart();
        const end = addHour(start);
        
        let options = '<option value="">PILIH KEGIATAN</option>';
        const kodeUrutan = ['1','2','3','5','6','7','8','9'];
        
        kodeUrutan.forEach(kodeStr => {
            const acts = mesin.activities?.[kodeStr];
            if (acts?.length) {
                options += `<optgroup label="KODE ${kodeStr} ${KODE_TKL[kodeStr]?.icon}">`;
                acts.forEach((a, idx) => {
                    const durasiText = a.durasi ? ` (${a.durasi} MIN)` : '';
                    options += `<option value="${kodeStr}_${idx}">${a.nama}${durasiText}</option>`;
                });
                options += '</optgroup>';
            }
        });
        
        showModal(`
            <h3 class="text-xl font-bold mb-6">➕ TAMBAH KEGIATAN</h3>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3">

                        <label class="text-xs font-semibold text-gray-500 mb-1">DARI</label>
                        <input type="time" id="modal-dari" class="input-field" value="${start}" ${!state.kegiatanList.length ? 'readonly' : ''}>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1">SAMPAI</label>
                        <input type="time" id="modal-sampai" class="input-field" value="${end}">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 mb-1">PILIH KEGIATAN</label>
                    <select id="modal-kegiatan-select" class="input-field" onchange="window.updateKegiatanFromSelect()">
                        ${options}
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 mb-1">NAMA KEGIATAN</label>
                    <input type="text" id="modal-kegiatan" class="input-field" readonly>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 mb-1">CATATAN</label>
                    <input type="text" id="modal-notes" class="input-field" placeholder="OPSIONAL">
                </div>
                <div class="flex gap-3 pt-4">
                    <button class="btn btn-primary flex-1" onclick="window.tambahKegiatanFromModal()">TAMBAH</button>
                    <button class="btn btn-secondary flex-1" onclick="window.closeModal()">BATAL</button>
                </div>
            </div>
        `);
    };
    
    window.updateKegiatanFromSelect = function() {
        const sel = document.getElementById('modal-kegiatan-select');
        if (!sel?.value) return;
        
        const [kode, idx] = sel.value.split('_');
        const mesin = state.machines.find(m => m.id === state.selectedMachineId);
        const kegiatan = mesin?.activities?.[kode]?.[parseInt(idx)];
        
        if (kegiatan) {
            document.getElementById('modal-kegiatan').value = kegiatan.nama;
        }
    };
    
    window.tambahKegiatanFromModal = function() {
        const dari = document.getElementById('modal-dari')?.value;
        const sampai = document.getElementById('modal-sampai')?.value;
        const kegiatan = document.getElementById('modal-kegiatan')?.value;
        const notes = document.getElementById('modal-notes')?.value || '';
        const sel = document.getElementById('modal-kegiatan-select');
        
        if (!sel?.value || !kegiatan) {
            showToast('PILIH KEGIATAN', 'error');
            return;
        }
        
        const [kode] = sel.value.split('_');
        
        if (isTimeGreater(sampai, getShiftEnd())) {
            showToast('MELEBIHI JAM AKHIR SHIFT', 'error');
            return;
        }
        
        if (state.kegiatanList.length === 0) {
            const shiftStart = getShiftStart();
            if (dari !== shiftStart) {
                showToast(`KEGIATAN PERTAMA HARUS MULAI JAM ${shiftStart}`, 'error');
                return;
            }
        } else {
            const last = state.kegiatanList[state.kegiatanList.length - 1];
            if (dari !== last.jam) {
                showToast(`HARUS LANJUT DARI JAM ${last.jam}`, 'error');
                return;
            }
        }
        
        state.kegiatanList.push({
            dari, jam: sampai, kode: parseInt(kode), kegiatan: toUpper(kegiatan), notes: toUpper(notes), wr: ''
        });
        
        closeModal();
        renderApp();
        showToast('KEGIATAN DITAMBAHKAN');
    };
    
    window.simpanData = function() {
        if (!state.selectedShift || !state.selectedMachineId || !state.selectedOperator) {
            showToast('LENGKAPI SEMUA FIELD HEADER', 'error');
            return;
        }
        if (!state.kegiatanList.length) {
            showToast('MINIMAL 1 KEGIATAN', 'error');
            return;
        }
        if (!state.batches.length) {
            showToast('MINIMAL 1 BATCH', 'error');
            return;
        }
        
        const oeeData = hitungAvailAndOEE();
        const resume = hitungResume();
        const mesin = state.machines.find(m => m.id === state.selectedMachineId);
        const jamKerja = getShiftMinutes(state.selectedShift);
        
        const record = {
            id: crypto.randomUUID(),
            date: state.selectedDate,
            shift: state.selectedShift,
            shift_minutes: jamKerja,
            mesin_id: state.selectedMachineId,
            mesin_name: mesin?.name,
            operator: toUpper(state.selectedOperator),
            kegiatan: [...state.kegiatanList],
            batches: [...state.batches],
            minor_stop: { ...state.minorStopCounts },
            total_odt: resume.totalODT,
            total_running: resume.totalRunning,
            total_line_stop_mesin: resume.totalLineStopMesin,
            total_line_stop_non_mesin: resume.totalLineStopNonMesin,
            total_good: state.batches.reduce((s,b)=>s+(b.good||0),0),
            total_defect: state.batches.reduce((s,b)=>s+(b.reject||0),0),
            availability: oeeData.avail,
            availability_365: oeeData.avail365,
            performance: oeeData.perf,
            quality: oeeData.quality,
            oee_actual: oeeData.oee,
            oee_365: oeeData.oee365,
            created_at: new Date().toISOString()
        };
        
        state.tklRecords.unshift(record);
        showToast('DATA BERHASIL DISIMPAN! ✨');
        
        // Reset form
        state.kegiatanList = [];
        state.batches = [];
        state.minorStopCounts = {};
        state.selectedShift = '';
        state.selectedMachineId = '';
        state.selectedOperator = '';
        
        state.currentPage = 'dashboard';
        renderApp();
    };

        }
        
        if (!state.libraryKegiatan[kode]) state.libraryKegiatan[kode] = [];
        state.libraryKegiatan[kode].push(toUpper(nama));
        localStorage.setItem('library_kegiatan', JSON.stringify(state.libraryKegiatan));
        
        closeModal();
        renderApp();
        showToast('KEGIATAN DITAMBAHKAN');
    };
    
    window.hapusDariLibrary = function(kode, item) {
        if (confirm(`HAPUS "${item}" DARI LIBRARY?`)) {
            state.libraryKegiatan[kode] = state.libraryKegiatan[kode].filter(i => i !== item);
            localStorage.setItem('library_kegiatan', JSON.stringify(state.libraryKegiatan));
            renderApp();
            showToast('KEGIATAN DIHAPUS', 'warning');
        }
    };
    
    window.showTambahMesinModal = function() {
        let html = `
            <h3 class="text-xl font-bold mb-6">➕ TAMBAH MESIN BARU</h3>
            <div class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1">NAMA MESIN</label>
                        <input type="text" id="modal-nama-mesin" class="input-field" placeholder="CONTOH: INJEKSI 1">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1">TARGET (PCS/MENIT)</label>
                        <input type="number" id="modal-target" class="input-field" placeholder="0" step="0.1">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 mb-1">MINOR STOP ITEMS</label>
                    <input type="text" id="modal-minor-stop" class="input-field" placeholder="ETIKET PUTUS, CODING KERING">
                </div>
                <div class="border-t pt-4">
                    <h4 class="font-semibold mb-4">PILIH KEGIATAN PER KODE</h4>
                    <div class="space-y-6 max-h-[400px] overflow-y-auto pr-2" id="machine-activities-container">
        `;
        
        const kodeUrutan = ['1','2','3','5','6','7','8','9'];
        
        kodeUrutan.forEach(kodeStr => {
            const libraryItems = state.libraryKegiatan[kodeStr] || [];
            html += `
                <div class="bg-gray-50 p-4 rounded-xl">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="kode-badge kode-${kodeStr}">KODE ${kodeStr}</span>
                        <span class="font-medium">${KODE_TKL[kodeStr].icon} ${KODE_TKL[kodeStr].name}</span>
                        ${KODE_TKL[kodeStr].hasDuration ? '<span class="text-xs text-blue-600">(WAJIB ISI DURASI)</span>' : ''}
                    </div>
                    <div class="space-y-3">
                        ${libraryItems.map((item, idx) => `
                            <div class="flex items-center gap-3 bg-white p-3 rounded-lg">
                                <input type="checkbox" id="cb_${kodeStr}_${idx}" class="w-4 h-4 text-blue-600 rounded" onchange="window.toggleDurationField('${kodeStr}', ${idx})">
                                <label for="cb_${kodeStr}_${idx}" class="flex-1 text-sm">${item}</label>
                                ${KODE_TKL[kodeStr].hasDuration ? `
                                    <div id="durasi_${kodeStr}_${idx}" class="hidden">
                                        <input type="number" class="input-field w-24 text-sm" placeholder="DURASI">
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                        ${!libraryItems.length ? '<p class="text-sm text-gray-400 italic">BELUM ADA KEGIATAN</p>' : ''}
                    </div>
                </div>
            `;
        });
        
        html += `
                    </div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button class="btn btn-primary flex-1" onclick="window.simpanMesinBaru()">SIMPAN</button>
                    <button class="btn btn-secondary flex-1" onclick="window.closeModal()">BATAL</button>
                </div>
            </div>
        `;
        
        showModal(html);
    };
    
    window.toggleDurationField = function(kode, idx) {
        const checkbox = document.getElementById(`cb_${kode}_${idx}`);
        const durasiDiv = document.getElementById(`durasi_${kode}_${idx}`);
        if (durasiDiv) {
            durasiDiv.classList.toggle('hidden', !checkbox.checked);
        }
    };
    
    window.simpanMesinBaru = function() {
        const nama = document.getElementById('modal-nama-mesin')?.value;
        const target = parseFloat(document.getElementById('modal-target')?.value) || 0;
        const minorStopStr = document.getElementById('modal-minor-stop')?.value || '';
        
        if (!nama) {
            showToast('NAMA MESIN HARUS DIISI', 'error');
            return;
        }
        
        const minorStop = minorStopStr.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
        const activities = {};
        const kodeUrutan = ['1','2','3','5','6','7','8','9'];
        
        for (let kodeIdx = 0; kodeIdx < kodeUrutan.length; kodeIdx++) {
            const kodeStr = kodeUrutan[kodeIdx];
            const libraryItems = state.libraryKegiatan[kodeStr] || [];
            const selected = [];
            
            for (let idx = 0; idx < libraryItems.length; idx++) {
                const checkbox = document.getElementById(`cb_${kodeStr}_${idx}`);
                if (checkbox?.checked) {
                    let durasi = null;
                    if (KODE_TKL[kodeStr]?.hasDuration) {
                        const durasiInput = document.querySelector(`#durasi_${kodeStr}_${idx} input`);
                        durasi = durasiInput ? parseInt(durasiInput.value) || null : null;
                        if (!durasi) {
                            showToast(`KODE ${kodeStr} WAJIB DIISI DURASI`, 'error');
                            return;
                        }
                    }
                    selected.push({ nama: libraryItems[idx], durasi });
                }
            }
            
            if (selected.length) activities[kodeStr] = selected;
        }
        
        if (!Object.keys(activities).length) {
            showToast('PILIH MINIMAL 1 KEGIATAN', 'error');
            return;
        }
        
        const newMachine = {
            id: crypto.randomUUID(),
            name: toUpper(nama),
            target,
            minorStop,
            activities
        };
        
        state.machines.push(newMachine);
        localStorage.setItem('machines', JSON.stringify(state.machines));
        closeModal();
        renderApp();
        showToast('MESIN DITAMBAHKAN');
    };
    
    window.editMachine = function(id) {
        showToast('FITUR EDIT SEGERA HADIR', 'warning');
    };
    
    window.deleteMachine = function(id) {
        if (confirm('YAKIN HAPUS MESIN INI?')) {
            state.machines = state.machines.filter(m => m.id !== id);
            localStorage.setItem('machines', JSON.stringify(state.machines));
            renderApp();
            showToast('MESIN DIHAPUS', 'warning');
        }
    };
    
    // ==================== DASHBOARD ACTIONS ====================
    window.updateFilter = function(key, value) {
        state.filters[key] = value;
        state.clickedRecordFilter = null;
        renderApp();
    };
    
    window.showRecordDetail = function(record) {
        showModal(`
            <h3 class="text-xl font-bold mb-4">📋 DETAIL RECORD</h3>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3 p-4 bg-gray-50 rounded-xl">
                    <div><span class="text-xs text-gray-500">TANGGAL</span><div>${formatDate(record.date)}</div></div>
                    <div><span class="text-xs text-gray-500">SHIFT</span><div>${record.shift}</div></div>
                    <div><span class="text-xs text-gray-500">MESIN</span><div>${record.mesin_name}</div></div>
                    <div><span class="text-xs text-gray-500">OPERATOR</span><div>${record.operator}</div></div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div class="p-3 bg-blue-50 rounded-lg text-center">
                        <div class="text-xs text-blue-600">AVAIL</div>
                        <div class="font-bold">${(record.availability || 0).toFixed(1)}%</div>
                    </div>
                    <div class="p-3 bg-purple-50 rounded-lg text-center">
                        <div class="text-xs text-purple-600">PERF</div>
                        <div class="font-bold">${(record.performance || 0).toFixed(1)}%</div>
                    </div>
                    <div class="p-3 bg-green-50 rounded-lg text-center">
                        <div class="text-xs text-green-600">QUAL</div>
                        <div class="font-bold">${(record.quality || 0).toFixed(1)}%</div>
                    </div>
                </div>
                <div class="p-4 bg-gradient-to-r from-blue-50 to-purple-50 rounded-xl text-center">
                    <div class="text-sm text-gray-600">OEE</div>
                    <div class="text-3xl font-bold ${(record.oee_actual || 0) >= 88 ? 'text-green-600' : 'text-red-600'}">
                        ${(record.oee_actual || 0).toFixed(1)}%
                    </div>
                </div>
                <button class="btn btn-secondary w-full" onclick="window.closeModal()">TUTUP</button>
            </div>
        `);
    };
    
    // ==================== NAVIGATION ====================
    window.navigateTo = function(page) {
        state.currentPage = page;
        if (page !== 'management') state.isManagementUnlocked = false;
        renderApp();
    };
    
    window.closeModal = closeModal;
    
    // ==================== INIT ====================
    function init() {
        console.log('Initializing OEE System...');
        document.documentElement.setAttribute('data-theme', state.theme);
        renderApp();
    }
    
    init();
})();
</script>

</body>
</html>
